 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه فالیا گلد</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #060908;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #f3f4f6;
        }

        /* فریم اختصاصی نمایشگر موبایل */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background: radial-gradient(circle at center, #111a16 0%, #050807 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        @media (min-width: 480px) {
            .mobile-container {
                border-radius: 36px;
                height: 92vh;
            }
        }

        /* باکس آدرس در بالای کارت دعوت */
        .address-banner {
            position: absolute;
            top: 25px;
            left: 20px;
            right: 20px;
            background: rgba(17, 26, 22, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            color: #f3e5ab;
            font-size: 0.82rem;
            line-height: 1.6;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 45;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        /* ظاهر شدن آدرس پس از باز شدن پاکت */
        .scene-viewport.opened ~ .address-banner {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.6s;
        }

        /* کانتینر اصلی صحنه ۳بعدی */
        .scene-viewport {
            width: 100%;
            height: 100%;
            perspective: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        /* استایل و انیمیشن شناور بودن پاکت‌نامه */
        .envelope-box {
            position: absolute;
            width: 86%;
            max-width: 330px;
            z-index: 20;
            transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.9s ease;
            transform-origin: center bottom;
            animation: floatEnvelope 3s infinite ease-in-out;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
        }

        .envelope-box img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
        }

        @keyframes floatEnvelope {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.015);
            }
        }

        /* برگه دعوت‌نامه سبز رنگ (مشخصات ۳بعدی تا شدن) */
        .card-wrapper {
            position: absolute;
            width: 82%;
            max-width: 310px;
            z-index: 10;
            opacity: 0;
            transform-style: preserve-3d;
            transform: translateY(80px) scale(0.75) rotateX(-75deg);
            transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.8s ease;
            transform-origin: center center;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
            margin-top: 25px; /* تنظیم فاصله از آدرس بالای کارت */
        }

        .card-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 14px;
            display: block;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* حالت باز شده */
        .scene-viewport.opened .envelope-box {
            animation: none;
            transform: translateY(140px) scale(0.85);
            opacity: 0;
            filter: blur(8px) drop-shadow(0 0 0 transparent);
            pointer-events: none;
        }

        .scene-viewport.opened .card-wrapper {
            opacity: 1;
            z-index: 30;
            transform: translateY(0) scale(1) rotateX(0deg);
            transition-delay: 0.15s;
        }

        /* راهنمای متنی کلیک */
        .tap-instruction {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            text-align: center;
            color: #d4af37;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            z-index: 40;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: pulseText 2s infinite;
            padding: 0 15px;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .scene-viewport.opened ~ .tap-instruction {
            opacity: 0;
            transform: translateY(10px);
        }

        /* دکمه مشاهده مجدد (ریست) */
        .replay-btn {
            position: absolute;
            bottom: 25px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s ease;
            z-index: 50;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #f3e5ab;
            backdrop-filter: blur(8px);
        }

        .scene-viewport.opened ~ .replay-btn {
            opacity: 1;
            pointer-events: auto;
            transition-delay: 1.2s;
        }

        .replay-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- صحنه اصلی موشن گرافی -->
        <div class="scene-viewport" id="sceneViewport" onclick="openEnvelope()">
            
            <!-- تصویر ۱: پاکت‌نامه -->
            <div class="envelope-box" id="envelopeBox">
                <img src="1000069251.png" alt="پاکت‌نامه فالیا گلد">
            </div>

            <!-- تصویر ۲: برگه دعوت‌نامه سبز رنگ -->
            <div class="card-wrapper" id="cardWrapper">
                <img src="1000069250.png" alt="دعوت‌نامه فالیا گلد">
            </div>

        </div>

        <!-- آدرس گالری (در بالای صفحه) -->
        <div class="address-banner">
            <div class="font-bold text-yellow-400 mb-0.5">📍 آدرس گالری:</div>
            <div>خیابان امامزاده - پاساژ امیر - طبقه همکف - گالری طلا فالیا گلد</div>
        </div>

        <!-- متن راهنمای ورودی -->
        <div class="tap-instruction">
            <span>✨ برای باز کردن پاکت‌نامه لمس کنید ✨</span>
        </div>

        <!-- دکمه مشاهده مجدد -->
        <button class="replay-btn px-5 py-2 rounded-full text-xs font-medium tracking-wide shadow-lg" onclick="resetEnvelope()">
            نمایش مجدد ↺
        </button>

    </div>

    <script>
        function openEnvelope() {
            const viewport = document.getElementById('sceneViewport');
            if (!viewport.classList.contains('opened')) {
                viewport.classList.add('opened');
            }
        }

        function resetEnvelope() {
            const viewport = document.getElementById('sceneViewport');
            viewport.classList.remove('opened');
        }
    </script>

</body>
</html>
